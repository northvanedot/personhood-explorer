<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personhood Explorer</title>
    <style>
      /* Dark only, monochrome: Polkadot's current dark neutrals (polkadot.com,
         2026-10-24) with white as the accent and no pink. Yes / No / Couldn't
         check keep their own colours: an unknown must never look like a "no". */
      :root {
        color-scheme: dark;
        --bg: #0f0f0f;
        --panel: #1c1917;
        --ink: #fafaf9;
        --muted: #a8a29e;
        --line: #44403c;
        --accent: #fafaf9;
        --accent-soft: rgba(250, 250, 249, 0.08);
        --button: #fafaf9;
        --button-ink: #1c1917;
        --yes: #4ade80;
        --yes-soft: rgba(74, 222, 128, 0.12);
        --no: #a8a29e;
        --no-soft: rgba(168, 162, 158, 0.13);
        --unknown: #fb923c;
        --unknown-soft: rgba(251, 146, 60, 0.13);
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0; color: var(--ink); min-height: 100vh; position: relative;
        font: 16px/1.55 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        background: radial-gradient(56rem 26rem at 50% -6rem, rgba(250, 250, 249, 0.08), transparent 70%);
      }
      /* A dot grid at the top, fading out: Polkadot's dots without its colours. */
      body::before {
        content: ""; position: absolute; inset: 0 0 auto 0; height: 30rem; z-index: -1;
        pointer-events: none;
        background: radial-gradient(circle at 1px 1px, rgba(250, 250, 249, 0.1) 1px, transparent 0) 0 0 / 22px 22px;
        -webkit-mask-image: linear-gradient(to bottom, #000, transparent);
        mask-image: linear-gradient(to bottom, #000, transparent);
      }
      .serif { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; }
      main { max-width: 680px; margin: 0 auto; padding: 4.5rem 1.1rem 5rem; }
      h1 {
        font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
        font-size: clamp(2.7rem, 10vw, 3.8rem); line-height: 1.02; letter-spacing: -0.01em;
        margin: 0 0 .8rem;
      }
      .lede { color: var(--muted); font-size: 1.1rem; margin: 0 0 2rem; }
      .search { display: flex; gap: .55rem; }
      input {
        flex: 1; min-width: 0; padding: 1rem 1.15rem; font-size: 1.02rem; font-family: inherit;
        background: var(--panel); color: var(--ink);
        border: 1px solid var(--line); border-radius: 14px;
      }
      input::placeholder { color: #78716c; }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
      button.go {
        padding: 1rem 1.5rem; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer;
        background: var(--button); color: var(--button-ink); border: 0; border-radius: 14px;
      }
      button.go:hover { opacity: .9; }
      button.go:disabled { opacity: .55; cursor: default; }
      .card {
        background: linear-gradient(180deg, rgba(250, 250, 249, 0.04), rgba(250, 250, 249, 0.01)), var(--panel);
        border: 1px solid var(--line); border-radius: 20px;
        padding: 1.5rem 1.4rem 1.1rem; margin-top: 1.8rem;
        box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.7);
      }
      .who { display: flex; gap: 1rem; align-items: center; }
      .avatar {
        width: 3.4rem; height: 3.4rem; border-radius: 50%; flex: none;
        display: grid; place-items: center; font-size: 1.5rem;
        font-family: "DM Serif Display", Georgia, serif;
        background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line);
      }
      .who h2 {
        margin: 0; font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
        font-size: 1.9rem; line-height: 1.1; word-break: break-all;
      }
      .who p { margin: .15rem 0 0; font-size: .88rem; color: var(--muted); }
      .status { margin: 1.1rem 0 1rem; }
      .status .pill { font-size: .95rem; padding: .35rem .85rem; }
      .rows { border-top: 1px solid var(--line); }
      .row {
        display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        padding: .85rem 0; border-bottom: 1px solid var(--line);
      }
      .row:last-child { border-bottom: 0; }
      .row .k { font-size: .98rem; }
      .row .v { text-align: right; font-size: .98rem; }
      .addr { font-family: var(--mono); font-size: .85rem; }
      .pill {
        display: inline-block; padding: .25rem .75rem; border-radius: 999px;
        font-size: .85rem; font-weight: 600; white-space: nowrap;
      }
      .pill.yes { color: var(--yes); background: var(--yes-soft); }
      .pill.no { color: var(--no); background: var(--no-soft); }
      /* Unknown is its own colour so it never reads as a "no". */
      .pill.unknown { color: var(--unknown); background: var(--unknown-soft); }
      .help { font-size: .85rem; color: var(--muted); margin: .4rem 0 0; }
      .copy {
        font: inherit; font-size: .75rem; margin-left: .45rem; cursor: pointer;
        color: var(--muted); background: none; border: 1px solid var(--line);
        border-radius: 6px; padding: .05rem .45rem;
      }
      .err {
        margin-top: 1rem; padding: .85rem 1rem; border-radius: 14px;
        background: var(--unknown-soft); color: var(--unknown); font-size: .95rem;
      }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .65rem; margin: 2.4rem 0 0; }
      .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1rem; }
      .stat b {
        display: block; font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
        font-size: 2.4rem; line-height: 1.05; font-variant-numeric: tabular-nums;
      }
      .stat span { font-size: .85rem; color: var(--muted); }
      .live { font-size: .78rem; color: var(--muted); margin: .55rem 0 0; }
      h3 {
        font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
        font-size: 1.9rem; line-height: 1.1; margin: 3.6rem 0 .45rem;
      }
      .section-lede { color: var(--muted); font-size: 1rem; margin: 0 0 1.1rem; }
      .answer {
        font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
        font-size: 2.1rem; line-height: 1.1; margin: 0;
      }
      .answer.yes { color: var(--yes); }
      .answer.no { color: var(--ink); }
      .answer.unknown { color: var(--unknown); }
      .hidden { display: none; }
      @media (max-width: 520px) {
        main { padding-top: 3rem; }
        .search { flex-direction: column; }
        .stat b { font-size: 2rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Who is a person?</h1>
      <p class="lede">
        Look up a username, .dot name or address.
      </p>

      <div class="search">
        <input id="address" placeholder="Username, .dot name or address" spellcheck="false" autocomplete="off" />
        <button id="check" class="go">Look up</button>
      </div>
      <p id="error" class="err hidden"></p>

      <section id="card" class="card hidden" aria-live="polite">
        <div class="who">
          <div class="avatar" id="avatar">?</div>
          <div>
            <h2 id="title"></h2>
            <p id="subtitle"></p>
          </div>
        </div>
        <div class="status">
          <span id="person"></span>
          <p class="help" id="personHelp"></p>
        </div>
        <div class="rows">
          <div class="row hidden" id="appsRow">
            <div>
              <div class="k">Proven to apps</div>
              <p class="help" id="appsHelp"></p>
            </div>
            <div class="v" id="apps"></div>
          </div>
          <div class="row">
            <div class="k">.dot names</div>
            <div class="v" id="names"></div>
          </div>
          <div class="row">
            <div class="k">Address</div>
            <div class="v" id="addr"></div>
          </div>
        </div>
      </section>

      <div class="stats" aria-live="polite">
        <div class="stat"><b id="statPeople">…</b><span>verified people</span></div>
        <div class="stat hidden" id="statAliasesCard"><b id="statAliases">…</b><span>proven to apps</span></div>
      </div>
      <p class="live" id="statsNote">Live from the Polkadot devnet</p>

      <h3>Can I get this .dot name?</h3>
      <p class="section-lede">.dot names are web addresses for Polkadot apps.</p>
      <div class="search">
        <input id="label" placeholder="yourname" spellcheck="false" autocomplete="off" />
        <button id="checkName" class="go">Check</button>
      </div>
      <p id="nameError" class="err hidden"></p>
      <section id="nameResult" class="card hidden" aria-live="polite">
        <p class="answer" id="nameAnswer"></p>
        <p class="help" id="nameWhy"></p>
      </section>

    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
